id: example:default

world: 'world'

generator1:
  type: generator:fixed
  at: '0;100;0'

generator:
  type: generator:random
  radius: '2500'
  min_y: 50
  max_y: 100
  clear_zone: 4 # -4 <-> +4
  clear_y: 3
  air_tester: '!solid & !water & !lava'
  solid_tester: 'solid & !ice'
  # (air|cave_air)&!solid
  # !solid&air|!solid&cave_air



args:
  loot_table: 'example/default'
  type: 'обычный'

spawner:
  type: spawner:timer
  time: 5m
  on_create:
    - weights:
        20:
          - set_value: loot_table example/epic
          - set_value: type элитный
        50:
          - set_value: loot_table example/rare
          - set_value: type редкий
        100:
          - set_value: loot_table example/default
          - set_value: type обычный
    - bc: |
        <white> 
        <center><white>Аирдроп {value:type}
        <center><white>появится через 5 минут!
        <white>
  when:
    2m:
      - bc: |
          <white>
          <center><white>Аирдроп {value:type}
          <center><white>появится через 2 минуты!
          <white>
    1m:
      - bc: |
          <white>
          <center><white>Аирдроп {value:type}
          <center><white>появится через 1 минуту!
          <white>
    5s-1s:
      - bc: |
          <white>
          <center><white>Аирдроп {value:type}
          <center><white>появится через {time} сек.
          <white>
  on_timer_end:
    - bc: |
        <white>
        <center><white>Аирдроп {value:type}
        <center><white>появился на [{x}, {y}, {z}]
        <white>
    - make:
        loot_table: '{value:loot_table}'
        type: '{value:type}'

nodes:
  __init__:
    type: __init__
    on_init:
      - create: region
      - setblock: '{x} {y} {z} minecraft:respawn_anchor[charges=4]'
      - create: 'tto'

  region:
    type: wg:region
    size: '15;15;15'
    flags:
      - 'use deny'
      - 'other-explosion deny'
      - 'mob-damage allow'
      - 'pvp allow'
      - 'tnt deny'
      - 'ghast-fireball deny'
      - 'wither-damage deny'
      - 'creeper-explosion deny'
      - 'vehicle-destroy allow'
      - 'interact deny'
      - 'entry-deny-message -e'
      - 'deny-message -e'
      - 'exit-deny-message -e'


  # time to open timer
  tto:
    type: tick:timer
    # in: create, remove
    timer: 30
    on_create:
      - create: tto_holo
    on_tick:
      - call: update tto_holo
    on_timer_end:
      - create: tte
    on_remove:
      - remove: tto_holo

  # time to open hologram
  tto_holo:
    type: dh:hologram
    # in: create, remove, update
    offsets: "0.5;1.8;0.5"
    lines:
      - '&cAirdrop'
      - '&fДо открытия: {ctx:tto.timer}'

  # time to end timer
  tte:
    type: tick:timer
    # in: create, remove
    timer: 30
    on_create:
      - create: tte_holo
      - create: looter
    on_tick:
      - call: update tte_holo
    on_timer_end: [ ]
    on_remove:
      - remove: tte_holo
      - remove: looter
      - destroy: ''

  # time to end hologram
  tte_holo:
    type: dh:hologram
    # in: create, remove, update
    offsets: "0.5;1.8;0.5"
    lines:
      - '&aAirdrop'
      - '&fДо удаления: {ctx:tte.timer}'

  looter:
    type: loot:looter
    offsets: '0;0;0'
    loot_table: '{args:loot_table}'
    title: '&aAirdrop!'
    on_open:
      - message: '&7Личное сообщение для %player_name%'

  __destroy__:
    type: __destroy__
    on_destroy:
      - remove: region
      - setblock: '{x} {y} {z} air'