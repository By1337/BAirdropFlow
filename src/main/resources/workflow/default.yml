defaults:
  time_to_open: '30'
  time_to_end: '30'
id: example:default
world: world
generator1:
  type: generator:fixed
  at: 0;100;0
generator:
  type: generator:random
  radius: '2500'
  min_y: 50
  max_y: 100
  clear_zone: 4
  clear_y: 3
  air_tester: '!solid & !water & !lava'
  solid_tester: solid & !ice
  offsets: 0;2;0
args:
  loot_table: example/default
  type: обычный
spawner:
  type: spawner:timer
  time: 5s
  gps:
    publish: true
    publish_location: true
    gps_line: 'Аирдроп {type} в <lang:bairdropflow.world.{world}.in> через {formated_time_left}'
  on_create:
    - weights:
        '20':
          - set_value: loot_table example/epic
          - set_value: type элитный
        '50':
          - set_value: loot_table example/rare
          - set_value: type редкий
        '100':
          - set_value: loot_table example/default
          - set_value: type обычный
    - bc: "<white> \n<center><white>Аирдроп {value:type}\n<center><white>появится че\
      рез 5 минут!\n<white>\n"
  when:
    2m:
      - bc: |
          <white>
          <center><white>Аирдроп {value:type}
          <center><white>появится через 2 минуты!
          <white>
    1m:
      - bc: |
          <white>
          <center><white>Аирдроп {value:type}
          <center><white>появится через 1 минуту!
          <white>
    5s-1s:
      - bc: |
          <white>
          <center><white>Аирдроп {value:type}
          <center><white>появится через {time} сек.
          <white>
  on_timer_end:
    - bc: |
        <white>
        <center><white>Аирдроп {value:type}
        <center><white>появился на [{x}, {y}, {z}]
        <white>
    - make:
        loot_table: '{value:loot_table}'
        type: '{value:type}'
