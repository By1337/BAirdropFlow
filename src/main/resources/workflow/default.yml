nodes:
  __init__:
    type: __init__
    on_init:
      - create: region
      - setblock: '{x} {y} {z} minecraft:respawn_anchor[charges=4]'
       # create имеет флаги '-anon true' '-name name'
       # create: 'tto -anon true' # создаст компонент tto со случайным именем
       # create: 'tto -name new_name' # создаст компонент tto с именем new_name
      - create: 'tto'

  region:
    type: wg:region
    size: '15;15;15'
    flags:
      - 'use deny'
      - 'other-explosion deny'
      - 'mob-damage allow'
      - 'pvp allow'
      - 'tnt deny'
      - 'ghast-fireball deny'
      - 'wither-damage deny'
      - 'creeper-explosion deny'
      - 'vehicle-destroy allow'
      - 'interact deny'
      - 'entry-deny-message -e'
      - 'deny-message -e'
      - 'exit-deny-message -e'


  # time to open timer
  tto:
    type: timer
    # in: create, remove
    timer: 30
    on_create:
      - create: tto_holo
    on_tick:
      - call: update tto_holo
    on_remove:
      - remove: tto_holo
      - create: tte

  # time to open hologram
  tto_holo:
    type: dh:hologram
    # in: create, remove, update
    offsets: "0.5;1.8;0.5"
    lines:
      - '&cAirdrop'
      - '&fДо открытия: {ctx:tto.timer}'

  # time to end timer
  tte:
    type: timer
    # in: create, remove
    timer: 30
    on_create:
      - create: tte_holo
      - create: looter
    on_tick:
      - call: update tte_holo
    on_remove:
      - remove: tte_holo
      - remove: looter
      - destroy: ''

  # time to end hologram
  tte_holo:
    type: dh:hologram
    # in: create, remove, update
    offsets: "0.5;1.8;0.5"
    lines:
      - '&aAirdrop'
      - '&fДо удаления: {ctx:tte.timer}'

  looter:
    type: looter
    offsets: '0;0;0'
    loot_table: 'loot/default'
    title: '&aAirdrop!'
    on_open:
      - message: '&7Личное сообщение для %player_name%'


  __destroy__:
    type: __destroy__
    # in: destroy
    on_destroy:
      - remove: region
      - setblock: '{x} {y} {z} air'