defaults:
  air_name: Мистический алтарь
id: ft:altar
world: world
generator:
  type: generator:random
  center: 0;0;0
  radius: 2500
  min_y: 30
  max_y: 120
  clear_zone: 3
  clear_y: 1
  air_tester: '!solid & !water & !lava'
  solid_tester: solid & !water & !lava & !snow & !oak_leaves & !spruce_leaves & !birch_leaves
    & !jungle_leaves & !acacia_leaves & !dark_oak_leaves & !azure_bluet & !allium
    & !blue_orchid & !poppy & !dandelion & !seagrass & !dead_bush & !fern & !short_grass
    & !red_mushroom & !brown_mushroom & !lily_of_the_valley & !cornflower & !oxeye_daisy
    & !pink_tulip & !white_tulip & !orange_tulip & !red_tulip & !large_fern & !tall_grass
    & !peony & !rose_bush & !sunflower & !lilac & !cactus & !sugar_cane & !kelp &
    !lily_pad
  offsets: 0;2;0
args:
  loot_count: '20'
  air_type: <hover:show_text:'<dark_gray>[<#AAAAAA>★<gray>★★★★<dark_gray>]'><#AAAAAA>Обычный</hover>
  rarity_selected: '0'
spawner:
  type: spawner:timer
  time: 180s
  gps:
    publish: true
    publish_location: false
    gps_line: <hover:show_text:'<#E026E6>{air_name}<newline><gray>Событие появится
      через <green>{formated_time_left}<newline><gray>Координаты будут доступны после
      появления.'><#E026E6>{air_name}</hover> <white>{value:air_type}</white> <gray>через
      <#3EF6A6>{formated_time_left}</#3EF6A6></gray>
  on_create:
    - weights:
        '11':
          - set_value: air_type "<hover:show_text:'<dark_gray>[<#FFFF00>★★★★★<dark_gray>]'><gradient:#ADFF00:#FF7400>Легендарный</gradient></hover>"
          - set_value: loot_count 100
        '12':
          - set_value: air_type "<hover:show_text:'<dark_gray>[<#FB0000>★★★★<gray>★<dark_gray>]'><#FB0000>Элитный</hover>"
          - set_value: loot_count 70
        '17':
          - set_value: air_type "<hover:show_text:'<dark_gray>[<#E65400>★★★<gray>★★<dark_gray>]'><#E65400>Богатый</hover>"
          - set_value: loot_count 50
        '20':
          - set_value: air_type "<hover:show_text:'<dark_gray>[<#EB996A>★★<gray>★★★<dark_gray>]'><#EB996A>Солидный</hover>"
          - set_value: loot_count 30
        '30':
          - set_value: air_type "<hover:show_text:'<dark_gray>[<#AAAAAA>★<gray>★★★★<dark_gray>]'><#AAAAAA>Обычный</hover>"
          - set_value: loot_count 20
    - bc: |-
        <gradient:#6C00C5:#FB00B4:#6C00C5> ╔══╦══╦══╦══╦══╦══╦══╦══╗</gradient>
        <#6C00C5> ║
        <#6C00C5> ║<#FFFFE6>     <#e026e6><obfuscated>|||</obfuscated><#e026e6>  [Мистический алтарь]   <#e026e6><obfuscated>|||</obfuscated>
        <#6C00C5> ║<#FFFFE6>   Появится уже через<#3EF6A6> 3 минуты!
        <#6C00C5> ║
        <gradient:#6C00C5:#FB00B4:#6C00C5> ╚══╩══╩══╩══╩══╩══╩══╩══╝</gradient>
  when: { }
  on_timer_end:
    - make:
        loot_count: '{value:loot_count}'
        air_type: '{value:air_type}'
        rarity_selected: '1'
