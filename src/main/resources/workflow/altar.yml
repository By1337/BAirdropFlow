ewport":{"x":588.6848143298765,"y":-2109.7514009002853,"zoom":1.3413889927804956},"defaultsNode":{"x":-853.6822421299173,"y":-873.4214712785667}}'
nodes:
  __init__:
    type: __init__
    on_init:
      - create: start_actions
  __destroy__:
    type: __destroy__
    on_destroy: [ ]
  region:
    type: wg:region
    size: 20;200;20
    flags:
      - pvp allow
      - build deny
      - block-break deny
      - block-place deny
      - tnt deny
      - lighter deny
      - creeper-explosion deny
      - ghast-fireball deny
      - other-explosion deny
      - enderman-grief deny
      - fire-spread deny
      - snowman-trails deny
      - ravager-grief deny
      - lava-fire deny
      - water-flow deny
      - lava-flow deny
      - ice-melt deny
      - chest-access deny
    on_create:
      - create: gps
  gps:
    type: default:gps
    publish_location: true
    gps_line: '<#E026E6>● <hover:show_text:''<#E026E6>{air_name}<newline><gray>Мир:
      <white>{world}<newline><gray>Координаты: <white>{x} {y} {z}<newline><green>Нажмите,
      чтобы установить GPS.''><click:run_command:''/gps {ctx:gps.gps_id}''>{air_name}</click></hover>
      <white>{args:air_type}</white> <gray>[{world} {x}/{y}/{z}]</gray> <hover:show_text:''<green>Поставить
      GPS''><click:run_command:''/gps {ctx:gps.gps_id}''><green>[GPS]</green></click></hover>'
    on_create:
      - create: structure
  structure:
    type: schematic:paster
    path: ../BAirdropFlow/schematics/altar.schem
    offsets: 0;0;0
    no_replace:
      - bedrock
    no_place:
      - air
      - cave_air
      - void_air
    on_create:
      - create: closed_1
    replace:
      barrier: air
  loot_1:
    type: loot:looter
    offsets: 1;0;0
    loot_table: altar
    rolls: '{args:loot_count}'
    title: Мистический алтарь
    take_cooldown_ticks: 5
    fill_duration_ticks: 100
    on_open:
      - create: loot_1_open_commands
    obfuscation_materials:
      - nautilus_shell
      - phantom_membrane
      - gunpowder
      - gray_dye
    obfuscation_name: <gold>Богатое сокровище
    on_create:
      - create: loot_2
    on_remove:
      - remove: loot_2
  open_chests:
    type: default:commands
    on_run:
      - remove: closed_1
      - create: loot_1
  closed_1:
    type: block:click
    offsets: 1;0;0
    count: 2147483647
    on_click:
      - create: closed_1_click_commands
    on_create:
      - create: closed_2
    on_remove:
      - remove: closed_2
  closed_2:
    type: block:click
    offsets: -1;0;0
    count: 2147483647
    on_click:
      - create: closed_1_click_commands
    on_create:
      - create: closed_3
    on_remove:
      - remove: closed_3
  closed_3:
    type: block:click
    offsets: 0;0;1
    count: 2147483647
    on_click:
      - create: closed_1_click_commands
    on_create:
      - create: closed_4
    on_remove:
      - remove: closed_4
  closed_4:
    type: block:click
    offsets: 0;0;-1
    count: 2147483647
    on_click:
      - create: closed_1_click_commands
    on_create:
      - create: ambient
  loot_2:
    type: loot:looter
    offsets: -1;0;0
    loot_table: altar
    rolls: '{args:loot_count}'
    title: Мистический алтарь
    take_cooldown_ticks: 5
    fill_duration_ticks: 100
    on_open:
      - create: loot_1_open_commands
    obfuscation_materials:
      - nautilus_shell
      - phantom_membrane
      - gunpowder
      - gray_dye
    obfuscation_name: <gold>Богатое сокровище
    on_create:
      - create: loot_3
    on_remove:
      - remove: loot_3
  loot_3:
    type: loot:looter
    offsets: 0;0;1
    loot_table: altar
    rolls: '{args:loot_count}'
    title: Мистический алтарь
    take_cooldown_ticks: 5
    fill_duration_ticks: 100
    on_open:
      - create: loot_1_open_commands
    obfuscation_materials:
      - nautilus_shell
      - phantom_membrane
      - gunpowder
      - gray_dye
    obfuscation_name: <gold>Богатое сокровище
    on_create:
      - create: loot_4
    on_remove:
      - remove: loot_4
  loot_4:
    type: loot:looter
    offsets: 0;0;-1
    loot_table: altar
    rolls: '{args:loot_count}'
    title: Мистический алтарь
    take_cooldown_ticks: 5
    fill_duration_ticks: 100
    on_open:
      - create: loot_1_open_commands
    obfuscation_materials:
      - nautilus_shell
      - phantom_membrane
      - gunpowder
      - gray_dye
    obfuscation_name: <gold>Богатое сокровище
  ambient:
    type: particle:animation
    animation: altar-ambient
    offsets: 0;0;0
    ticks: -1
    on_create:
      - create: spawn_announcement
  started_holo:
    type: default:hologram
    offsets: 0.5;2.5;0.5
    lines:
      - <#e026e6>[Мистический алтарь]
      - <#e026e6>||| <white>Идёт активация. <#e026e6>|||
      - '<white>До открытия: <#ffa359>{ctx:started.timer} сек'
    on_create:
      - create: started_bar
    on_remove:
      - remove: started_bar
  started_bar:
    type: default:bossbar
    title: '<red>Мистический алтарь <gold>- до открытия: <red>{ctx:started.timer}
      сек'
    radius: 50
    color: red
    overlay: notched_20
    time: '{ctx:started.timer}'
    progress_from_time: true
    on_create: [ ]
    on_remove: [ ]
  started:
    type: tick:timer
    timer: 180
    on_create:
      - create: started_holo
    on_tick:
      - call: update started_holo
    on_timer_end:
      - create: open_chests
      - create: active
    on_remove:
      - remove: started_holo
  active_holo:
    type: default:hologram
    offsets: 0.5;2.5;0.5
    lines:
      - <#e026e6>[Мистический алтарь]
      - <#e026e6>||| <#34E95E>Алтарь открыт! <#e026e6>|||
    on_create:
      - create: active_bar
    on_remove:
      - remove: active_bar
  active_bar:
    type: default:bossbar
    title: '<red>Мистический алтарь <gold>- открыт: <red>{ctx:active.timer} сек'
    radius: 50
    color: red
    overlay: notched_20
    time: '{ctx:active.timer}'
    progress_from_time: true
  active:
    type: tick:timer
    timer: 60
    on_create:
      - create: active_holo
    on_tick:
      - call: update active_holo
    on_timer_end:
      - destroy: ''
    on_remove:
      - remove: active_holo
  loot_1_open_commands:
    type: default:commands
    on_run:
      - sound: block.chest.open 1 1
  closed_1_click_commands:
    type: default:commands
    on_run:
      - message: <center:200><red>Сундук ещё закрыт.
  start_actions:
    type: default:commands
    on_run:
      - if: '{args:rarity_selected} == 0'
        do:
          - weights:
              '11':
                - set_arg: air_type <hover:show_text:'<dark_gray>[<#FFFF00>★★★★★<dark_gray>]'><gradient:#ADFF00:#FF7400>Легендарный</gradient></hover>
                - set_arg: loot_count 100
              '12':
                - set_arg: air_type <hover:show_text:'<dark_gray>[<#FB0000>★★★★<gray>★<dark_gray>]'><#FB0000>Элитный</hover>
                - set_arg: loot_count 70
              '17':
                - set_arg: air_type <hover:show_text:'<dark_gray>[<#E65400>★★★<gray>★★<dark_gray>]'><#E65400>Богатый</hover>
                - set_arg: loot_count 50
              '20':
                - set_arg: air_type <hover:show_text:'<dark_gray>[<#EB996A>★★<gray>★★★<dark_gray>]'><#EB996A>Солидный</hover>
                - set_arg: loot_count 30
              '30':
                - set_arg: air_type <hover:show_text:'<dark_gray>[<#AAAAAA>★<gray>★★★★<dark_gray>]'><#AAAAAA>Обычный</hover>
                - set_arg: loot_count 20
      - create: region
  spawn_announcement:
    type: default:commands
    on_run:
      - bc: |-
          <gradient:#6C00C5:#FB00B4:#6C00C5> ╔══╦══╦══╦══╦══╦══╦══╦══╗</gradient>
          <#6C00C5> ║
          <#6C00C5> ║<#FFFFE6>     <#e026e6><obfuscated>|||</obfuscated><#e026e6>  [Мистический алтарь]   <#e026e6><obfuscated>|||</obfuscated>
          <#6C00C5> ║<#FFFFE6>   Уровень лута: {args:air_type}
          <#6C00C5> ║<#FFFFE6>   Появился на координатах <white><hover:show_text:'<green>Поставить GPS'><click:run_command:'/gps {ctx:gps.gps_id}'><white>[{x} {y} {z}]</white></click></hover>
          <#6C00C5> ║
          <gradient:#6C00C5:#FB00B4:#6C00C5> ╚══╩══╩══╩══╩══╩══╩══╩══╝</gradient>
      - sound_all: entity.lightning_bolt.thunder 1 1
      - create: started
