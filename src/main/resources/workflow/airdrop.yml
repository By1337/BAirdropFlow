defaults:
  air_name: Аирдроп
id: ft:airdrop
world: world
generator:
  type: generator:fixed
  at: 0;100;0
args:
  loot_count: '20'
  air_type: <hover:show_text:'<dark_gray>[<#AAAAAA>★<gray>★★★★<dark_gray>]'><#AAAAAA>Обычный</hover>
spawner:
  type: spawner:timer
  time: 1s
  on_create: []
  when: {}
  on_timer_end:
    - make: {}
nodes:
  __init__:
    type: __init__
    on_init:
      - create: start_actions
  __destroy__:
    type: __destroy__
    on_destroy: []
  region:
    type: wg:region
    size: 5;5;5
    flags:
      - block-break deny
      - block-place deny
    on_create:
      - create: torch
  torch:
    type: schematic:paster
    path: ../BAirdropFlow/schematics/block-redstone_torch.schem
    offsets: 0;0;0
    no_replace: []
    no_place:
      - air
      - cave_air
      - void_air
    on_create:
      - create: summon_animation
    replace:
      barrier: air
  barrel:
    type: schematic:paster
    path: ../BAirdropFlow/schematics/block-barrel.schem
    offsets: 0;0;0
    no_replace: []
    no_place:
      - air
      - cave_air
      - void_air
    replace:
      barrier: air
    on_create:
      - create: active
  summon_animation:
    type: particle:animation
    animation: airdrop-summon
    offsets: 0;0;0
    ticks: 300
    on_create:
      - create: summon_falling
  animation_wait:
    type: tick:timer
    timer: 15
    on_create:
      - create: summon_sound_start
    on_tick:
      - create: summon_sound_tick
    on_timer_end:
      - create: summon_sound_end
  started_bar:
    type: default:bossbar
    title: '<#FF1515>Аир-дроп <#FF9800>- вызвали: <#FF1515>{ctx:started.timer} сек'
    radius: 80
    color: red
    overlay: notched_20
    time: '{ctx:started.timer}'
    progress_from_time: true
    on_create:
      - create: started_holo
    on_remove:
      - remove: started_holo
  started_holo:
    type: default:hologram
    offsets: 0.5;2;0.5
    lines:
      - <bold><gradient:#FF4B00:#FF8900>Аирдроп</gradient></bold>
      - <gold>Сигнал отправлен
  started:
    type: tick:timer
    timer: 60
    on_create:
      - create: started_bar
    on_timer_end:
      - remove: torch
      - create: barrel
    on_remove:
      - remove: started_bar
  active_bar:
    type: default:bossbar
    title: '<#FF1515>Аир-дроп <#FF9800>- получаем: <#FF1515>{ctx:active.timer} сек'
    radius: 80
    color: red
    overlay: notched_20
    time: '{ctx:active.timer}'
    progress_from_time: true
    on_create:
      - create: active_holo
    on_remove:
      - remove: active_holo
  active_holo:
    type: default:hologram
    offsets: 0.5;2;0.5
    lines:
      - <bold><gradient:#FF4B00:#FF8900>Аирдроп</gradient></bold>
      - <green>Открыт
    on_create:
      - create: looter
    on_remove:
      - remove: looter
  active:
    type: tick:timer
    timer: 300
    on_create:
      - create: active_bar
    on_timer_end:
      - destroy: ''
    on_remove:
      - remove: active_bar
  looter:
    type: loot:looter
    loot_table: airdrop
    rolls: '{args:loot_count}'
    title: <#E63434><bold>★ <gradient:#F71111:#FF8900>Аирдроп ★</gradient>
    inventory_type: dispenser
    size: 9
    fill_interval_ticks: 100
    fill_interval_max_ticks: 200
    reveal_delay_ticks: 100
    reveal_delay_max_ticks: 140
    obfuscation_materials:
      - blaze_powder
    obfuscation_name: <gradient:#251F1F:#2E1919>[.] </gradient><gradient:#371212:#FFF701>Предмет
      ещё не остыл</gradient>
  summon_sound_start:
    type: default:commands
    on_run:
      - nearby-30:
          - sound: entity.blaze.shoot 0.4 1.2
  summon_sound_tick:
    type: default:commands
    on_run:
      - if: '{ctx:animation_wait.timer} % 3 == 0 && {ctx:animation_wait.timer} > 2'
        do:
          - nearby-30:
              - sound: block.fire.extinguish 0.4 1.0
  summon_sound_end:
    type: default:commands
    on_run:
      - nearby-30:
          - sound: entity.generic.explode 1.0 0.8
      - create: started
  start_actions:
    type: default:commands
    on_run:
      - weights:
          '11':
            - set_arg: air_type <hover:show_text:'<dark_gray>[<#FFFF00>★★★★★<dark_gray>]'><gradient:#ADFF00:#FF7400>Легендарный</gradient></hover>
            - set_arg: loot_count 100
          '12':
            - set_arg: air_type <hover:show_text:'<dark_gray>[<#FB0000>★★★★<gray>★<dark_gray>]'><#FB0000>Элитный</hover>
            - set_arg: loot_count 70
          '17':
            - set_arg: air_type <hover:show_text:'<dark_gray>[<#E65400>★★★<gray>★★<dark_gray>]'><#E65400>Богатый</hover>
            - set_arg: loot_count 50
          '20':
            - set_arg: air_type <hover:show_text:'<dark_gray>[<#EB996A>★★<gray>★★★<dark_gray>]'><#EB996A>Солидный</hover>
            - set_arg: loot_count 30
          '30':
            - set_arg: air_type <hover:show_text:'<dark_gray>[<#AAAAAA>★<gray>★★★★<dark_gray>]'><#AAAAAA>Обычный</hover>
            - set_arg: loot_count 20
      - create: region
  summon_falling:
    type: ft:falling_blocks
    ground_material: true
    entity_lifetime_ticks: 200
    steps:
      - tick: 211
        offsets: 1.51;1.86;-0.88
        material: stone
        velocity: 0.498;0.654;-0.685
      - tick: 211
