defaults:
  air_name: Гейзер
id: ft:geyser
world: world
generator:
  type: generator:random
  center: 0;0;0
  radius: 2500
  min_y: 30
  max_y: 120
  clear_zone: 5
  clear_y: 4
  air_tester: '!solid & !water & !lava'
  solid_tester: solid & !water & !lava & !snow & !oak_leaves & !spruce_leaves & !birch_leaves & !jungle_leaves & !acacia_leaves & !dark_oak_leaves & !azure_bluet
    & !allium & !blue_orchid & !poppy & !dandelion & !seagrass & !dead_bush & !fern & !short_grass & !red_mushroom & !brown_mushroom & !lily_of_the_valley & !cornflower
    & !oxeye_daisy & !pink_tulip & !white_tulip & !orange_tulip & !red_tulip & !large_fern & !tall_grass & !peony & !rose_bush & !sunflower & !lilac & !cactus & !sugar_cane
    & !kelp & !lily_pad
  offsets: 0;4;0
args:
  loot_count: '20'
  air_type: <hover:show_text:'<dark_gray>[<#AAAAAA>★<gray>★★★★<dark_gray>]'><#AAAAAA>Обычный</hover>
  rarity_selected: '0'
spawner:
  type: spawner:timer
  time: 180s
  gps:
    publish: true
    publish_location: false
    gps_line: <hover:show_text:'<#E026E6>{air_name}<newline><gray>Событие появится через <green>{formated_time_left}<newline><gray>Координаты будут доступны после
      появления.'><#E026E6>{air_name}</hover> <white>{value:air_type}</white> <gray>через <#3EF6A6>{formated_time_left}</#3EF6A6></gray>
  on_create:
  - weights:
      '30':
      - set_value: air_type "<hover:show_text:'<dark_gray>[<#AAAAAA>★<gray>★★★★<dark_gray>]'><#AAAAAA>Обычный</hover>"
      - set_value: loot_count 20
      '20':
      - set_value: air_type "<hover:show_text:'<dark_gray>[<#EB996A>★★<gray>★★★<dark_gray>]'><#EB996A>Солидный</hover>"
      - set_value: loot_count 30
      '17':
      - set_value: air_type "<hover:show_text:'<dark_gray>[<#E65400>★★★<gray>★★<dark_gray>]'><#E65400>Богатый</hover>"
      - set_value: loot_count 50
      '12':
      - set_value: air_type "<hover:show_text:'<dark_gray>[<#FB0000>★★★★<gray>★<dark_gray>]'><#FB0000>Элитный</hover>"
      - set_value: loot_count 70
      '11':
      - set_value: air_type "<hover:show_text:'<dark_gray>[<#FFFF00>★★★★★<dark_gray>]'><gradient:#ADFF00:#FF7400>Легендарный</gradient></hover>"
      - set_value: loot_count 100
  - bc: |-
      <gradient:#D44B14:#282828:#FF540F> ╔═══╦═╦══╦═╦══╦══╦══╦══╗</gradient>
      <#D44B14> ║
      <#EA5012> ║<#FFFFE6>           <#282828><obfuscated>|||</obfuscated><#FF540F>   [Гейзер]   <#282828><obfuscated>|||</obfuscated>
      <#FF540F> ║<#FFFFE6>   Появится уже через<#FFCC00> 3 минуты!
      <#D44B14> ║
      <gradient:#D44B14:#282828:#FF540F> ╚═══╩═╩══╩═╩══╩══╩══╩══╝</gradient>
  when: {}
  on_timer_end:
  - make:
      loot_count: '{value:loot_count}'
      air_type: '{value:air_type}'
      rarity_selected: '1'
nodes:
  __init__:
    type: __init__
    on_init:
    - create: start_actions
  __destroy__:
    type: __destroy__
    on_destroy:
    - remove: spread
    - remove: structure
  region:
    type: wg:region
    size: 20;200;20
    flags:
    - pvp allow
    - build deny
    - block-break deny
    - block-place deny
    - tnt deny
    - lighter deny
    - creeper-explosion deny
    - ghast-fireball deny
    - other-explosion deny
    - enderman-grief deny
    - fire-spread deny
    - snowman-trails deny
    - ravager-grief deny
    - lava-fire deny
    - water-flow deny
    - lava-flow deny
    - ice-melt deny
    - chest-access deny
    on_create:
    - create: gps
  gps:
    type: default:gps
    publish_location: true
    gps_line: '<#E026E6>● <hover:show_text:''<#E026E6>{air_name}<newline><gray>Мир: <white>{world}<newline><gray>Координаты: <white>{x} {y} {z}<newline><green>Нажмите,
      чтобы установить GPS.''><click:run_command:''/gps {ctx:gps.gps_id}''>{air_name}</click></hover> <white>{args:air_type}</white> <gray>[{world} {x}/{y}/{z}]</gray>
      <hover:show_text:''<green>Поставить GPS''><click:run_command:''/gps {ctx:gps.gps_id}''><green>[GPS]</green></click></hover>'
    on_create:
    - create: structure
  structure:
    type: schematic:paster
    path: ../BAirdropFlow/schematics/geyser.schem
    offsets: 0;0;0
    no_replace:
    - bedrock
    no_place:
    - air
    - cave_air
    - void_air
    on_create:
    - create: ambient
    replace:
      barrier: air
  ambient:
    type: particle:animation
    animation: geyser-ambient
    offsets: 0;0;0
    ticks: -1
    on_create:
    - create: spawn_announcement
  started_bar:
    type: default:bossbar
    title: <aqua>Гейзер <gold>- Извержение через:<red> {ctx:started.timer}
    radius: 50
    color: red
    overlay: notched_20
    time: '{ctx:started.timer}'
    progress_from_time: true
  started:
    type: tick:timer
    timer: 300
    on_create:
      - create: started_bar
    on_timer_end:
      - create: active
    on_remove:
      - remove: started_bar
  active_bar:
    type: default:bossbar
    title: <aqua>Гейзер <gold>- Извергается:<red> {ctx:active.timer}
    radius: 50
    color: red
    overlay: notched_20
    time: '{ctx:active.timer}'
    progress_from_time: true
    on_create:
      - create: spread
  active:
    type: tick:timer
    timer: 100
    on_create:
      - create: active_bar
    on_timer_end:
      - call: erupt spread
      - remove: structure
    on_remove:
      - remove: active_bar
  spread:
    type: ft:geyser
    loot_table: geyser
    scan_radius: 15
    scan_y: 10
    interval_ticks: 4
    max_concurrent: 3
    effect_ticks: 60
    item_delay_ticks: 2
    entity_lifetime_ticks: 200
    trail_animation: geyser-trail
    falling_blocks: 50
    damage_radius: 8
    max_damage: 10
    obfuscation_materials: [nautilus_shell, phantom_membrane, gunpowder, gray_dye]
    obfuscation_name: <gold>Богатое сокровище
    on_finish:
    - destroy: ''

  start_actions:
    type: default:commands
    on_run:
    - if: '{args:rarity_selected} == 0'
      do:
      - weights:
          '30':
          - set_arg: air_type <hover:show_text:'<dark_gray>[<#AAAAAA>★<gray>★★★★<dark_gray>]'><#AAAAAA>Обычный</hover>
          - set_arg: loot_count 20
          '20':
          - set_arg: air_type <hover:show_text:'<dark_gray>[<#EB996A>★★<gray>★★★<dark_gray>]'><#EB996A>Солидный</hover>
          - set_arg: loot_count 30
          '17':
          - set_arg: air_type <hover:show_text:'<dark_gray>[<#E65400>★★★<gray>★★<dark_gray>]'><#E65400>Богатый</hover>
          - set_arg: loot_count 50
          '12':
          - set_arg: air_type <hover:show_text:'<dark_gray>[<#FB0000>★★★★<gray>★<dark_gray>]'><#FB0000>Элитный</hover>
          - set_arg: loot_count 70
          '11':
          - set_arg: air_type <hover:show_text:'<dark_gray>[<#FFFF00>★★★★★<dark_gray>]'><gradient:#ADFF00:#FF7400>Легендарный</gradient></hover>
          - set_arg: loot_count 100
    - create: region
  spawn_announcement:
    type: default:commands
    on_run:
    - bc: |-
        <gradient:#D44B14:#282828:#FF540F> ╔═══╦═╦══╦═╦══╦══╦══╦══╗</gradient>
        <#D44B14> ║
        <#EA5012> ║<#FFFFE6>           <#282828><obfuscated>|||</obfuscated><#FF540F>   [Гейзер]   <#282828><obfuscated>|||</obfuscated>
        <#FF540F> ║<#FFFFE6>   Уровень лута:<#FF540F> <#E65400>{args:air_type}
        <#EA5012> ║<#FFFFE6>   Появился на координатах<#FF540F> <#FF540F><hover:show_text:'<green>Поставить GPS'><click:run_command:'/gps {ctx:gps.gps_id}'><white>[{x} {y} {z}]</white></click></hover>
        <#D44B14> ║
        <gradient:#D44B14:#282828:#FF540F> ╚═══╩═╩══╩═╩══╩══╩══╩══╝</gradient>
    - sound_all: entity.lightning_bolt.thunder 1 1
    - create: started
$web_meta: '{"version":3,"nodes":{"__init__":{"x":0,"y":0,"width":400,"height":420,"title":"Запуск события"},"start_actions":{"x":520,"y":0,"width":900,"height":580,"title":"Выбор редкости"},"region":{"x":1540,"y":0,"width":400,"height":520,"title":"Защита территории"},"gps":{"x":2060,"y":0,"width":400,"height":420,"title":"Метка GPS"},"structure":{"x":2580,"y":0,"width":400,"height":620,"title":"Постройка схемы"},"ambient":{"x":0,"y":1100,"width":400,"height":420,"title":"Фоновые частицы"},"spawn_announcement":{"x":520,"y":1100,"width":960,"height":450,"title":"Объявление о появлении"},"started":{"x":2500,"y":1100,"width":480,"height":640,"title":"Ожидание открытия"},"started_bar":{"x":3100,"y":1100,"width":400,"height":420,"title":"Боссбар до открытия"},"active":{"x":2500,"y":2300,"width":480,"height":640,"title":"Время открытого события"},"active_bar":{"x":3100,"y":2300,"width":400,"height":420,"title":"Боссбар после открытия"},"spread":{"x":3620,"y":2300,"width":400,"height":420,"title":"Выброс предметов"},"__destroy__":{"x":2500,"y":3400,"width":400,"height":420,"title":"Удаление события"}},"webNodes":{"note_setup":{"type":"web:note","x":0,"y":-380,"width":850,"height":260,"title":"1. Подготовка","text":"Запуск → редкость → регион → GPS → постройка. Дальше цепочка продолжается в следующем ряду."},"note_wait":{"type":"web:note","x":0,"y":700,"width":850,"height":260,"title":"2. Ожидание открытия","text":"Оформление и объявление → таймер. Справа от таймера — его голограмма и боссбар."},"note_active":{"type":"web:note","x":0,"y":1900,"width":850,"height":260,"title":"3. Открытое событие","text":"Эффекты открытия → таймер работы события → удаление. Оформление удаляется по обратной цепочке."}},"defaultsNode":{"x":1000,"y":-380,"width":400,"height":310},"viewport":{"x":60,"y":180,"zoom":0.5}}'
