# Призывной Загадочный маяк. Лучи генерируются; таблица из 165 точек не нужна.
id: ft:strange_beacon
world: world
nearby_radius: 48 # Только видимость голограмм/эффектов; радиус выплат задан в rewards.
generator:
  type: generator:fixed
  at: 0;100;0
spawner:
  type: spawner:timer
  time: 1s
  when: { }
  on_timer_end:
    - make: { }
nodes:
  __init__:
    type: __init__
    on_init:
      - create: region
  __destroy__:
    type: __destroy__
    on_destroy:
      - remove: summon
      - remove: activation
      - remove: active
      - remove: rewards
      - remove: activation_holo
      - remove: active_holo
      - remove: structure
  region:
    type: wg:region
    size: 5;5;5
    flags:
      - block-break deny
      - block-place deny
      - tnt deny
      - creeper-explosion deny
      - other-explosion deny
    on_create:
      - create: gps
  gps:
    type: default:gps
    publish_location: true
    gps_line: '<gold>Загадочный маяк <gray>[{world} {x}/{y}/{z}]'
    on_create:
      - create: announce
  announce:
    type: default:commands
    on_run:
      - bc: '<gold>[Загадочный маяк] <white>Призван на координатах <yellow>{x} {y} {z}'
      - create: summon
  summon:
    type: ft:strange_beacon
    offsets: 0.5;0;0.5
    max_entities: 256
    entity_lifetime_ticks: 200
    rays:
      radius: 9
      count: 8
      step: 0.6
      speed: 0.225 # блоков за тик: до края за 40 тиков
      jitter: 0.15
      rotation: 0
    ground:
      search_up: 8
      search_down: 8
      offset: -0.3
      vertical_step: 0.3
    stages:
      - material: fire_coral_block
        ticks: 40
      - material: horn_coral_block
        ticks: 3
      - material: fire_coral_block
        ticks: 40
      - material: black_concrete_powder
        ticks: 12
    build_start_tick: 81
    on_build_start:
      - create: structure
  structure:
    type: schematic:paster
    path: ../BAirdropFlow/schematics/strange-beacon.schem
    no_place:
      - air
      - cave_air
      - void_air
    no_replace:
      - bedrock
    animation:
      interval_ticks: 2
      blocks_per_step: 1
      shuffle_layer: true
      sound: block.stone.place
      volume: 0.8
      pitch: 1.2
    on_complete:
      - create: built
  built:
    type: default:commands
    on_run:
      - sound_all: block.note_block.pling 2 1
      - sound_all: block.beacon.activate 2 1
      - create: activation
  activation:
    type: tick:timer
    timer: 60
    on_create:
      - create: activation_holo
    on_tick:
      - call: update activation_holo
    on_timer_end:
      - create: active
    on_remove:
      - remove: activation_holo
  activation_holo:
    type: default:hologram
    offsets: 0.5;4;0.5
    lines:
      - '<#FFFFE6>До открытия: <#f2913c>{ctx:activation.timer} сек'
      - '<#e026e6><obf>1</obf> <#FFFFE6>Идёт активация. <#e026e6><obf>1</obf>'
      - '<#e026e6>[Загадочный маяк]'
  active:
    type: tick:timer
    timer: 180
    on_create:
      - create: active_holo
    on_tick:
      - call: update active_holo
    on_timer_end:
      - destroy: ''
    on_remove:
      - remove: active_holo
  active_holo:
    type: default:hologram
    offsets: 0.5;4;0.5
    lines:
      - '<#FFFFE6>До закрытия: <#f2913c>{ctx:active.timer} сек'
      - <#e026e6>[Загадочный маяк]
    on_create:
      - create: rewards
    on_remove:
      - remove: rewards
  rewards:
    type: ft:proximity_reward
    offsets: 0.5;2;0.5
    interval_ticks: 50
    radius: 20 # Независимый радиус выплат от центра offsets.
    min_reward: 10000
    max_reward: 90000
    on_reward:
      - create: payout
  payout:
    type: default:commands
    on_run:
      - console: eco give {target:player_name} {ctx:rewards.amount}
      - message: '<dark_green>[$] <white>Вы получили <#FF6700>${ctx:rewards.amount} <white>от <aqua>Загадочного маяка'
