name: BAirdropFlow
main: dev.by1337.baf.BAirdropFlow
version: '${version}'
api-version: '1.21'
depend:
  - BLib
  - BMenu
  - WorldEdit

softdepend:
  - DecentHolograms

permissions:
  baf.loot.admin:
    description: Управление таблицами лута
    default: op

  baf.admin:
    description: Управление аирдропами
    default: op
  baf.web.admin:
    description: Получение ссылки на веб-редактор аирдропов
    default: op
