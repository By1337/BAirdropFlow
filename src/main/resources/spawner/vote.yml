type: default:vote
id: example:vote
duration: 60s
menu: baf:vote
publish_gps: true
# Keys are IDs from the common launch registry, values are display names.
options:
  example:default: Аирдроп
tie: random
no_votes: random
messages:
  started: "<gold>Выберите следующее событие: <click:run_command:'/vote'><green>[/vote]</green></click> <gray>{time_left} сек."
  ended: "<gold>Победитель: <yellow>{winner}"
  voted: "<green>Ваш голос: <yellow>{selected}"
  cancelled: "<gray>Голосование завершено без запуска события."
