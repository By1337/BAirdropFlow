nodes:
  schematic:
    type: schematic:paster
    path: '../WorldEdit/schematics/asteroid.schem'
    offset: 0;0;0
    no_replace:
      - bedrock
    no_place:
      - bedrock
    replace:
      barrier: air
    on_create: [ ]
    on_remove: [ ]



  # КОМПОНЕНТ: tick:timer
  # Таймер с обратным отсчетом, вызывающий события на каждом тике и по завершению
  # Поля:
  #   timer: int (обяз.) - начальное значение таймера в тиках
  #   on_create: list (опц., []) - действия при создании
  #   on_tick: list (опц., []) - действия на каждом тике (кроме последнего)
  #   on_remove: list (опц., []) - действия при удалении
  #   on_timer_end: list (опц., []) - действия когда таймер достиг нуля
  # Плейсхолдеры:
  #   {ctx:<имя>.timer} - оставшееся время в тиках
  # Логика:
  #   При создании вызывает on_create. На каждом тике уменьшает timer на 1.
  #   Пока timer > 0 → on_tick. После → on_timer_end → on_remove
  #   После on_timer_end автоматически вызывается on_remove
  #   Если кто-то удалит компонент через remove: <name> вызовется только on_remove
  #   При удалении вызывает on_remove.
  timer:
    type: tick:timer
    timer: 30
    on_create: [ ]
    on_tick: [ ]
    on_timer_end: [ ]
    on_remove: [ ]

  # TTL ожидания: create запускает отсчёт, remove отменяет его.
  # 1200 тиков = 60 секунд при 20 TPS. Только по истечении TTL удаляем аирдроп.
  # При клике удалите ttl, затем создайте таймер до открытия.
  ttl:
    type: tick:timeout
    ticks: 1200
    on_remove: [ ]
    on_timer_end:
      - destroy: ''

  # Анимация из plugins/BAirdropFlow/particles/example.yml (ID без расширения).
  particle:
    type: particle:animation
    animation: example
    offsets: 0;0;0
    ticks: 100
    on_create: [ ]
    on_timer_end: [ ]
    on_remove: [ ]

  commands:
    type: default:commands
    on_run:
      - setblock: '{x} {y} {z} minecraft:respawn_anchor[charges=4]'
      - console: '123213'

  # Создайте timer перед bossbar. Время обновляется автоматически.
  # Прогресс = текущее время / значение, полученное при создании боссбара.
  bossbar:
    type: default:bossbar
    radius: 64
    title: '<gold>До открытия: <white>{ctx:bossbar.time}'
    color: green
    overlay: progress
    flags: [ ] # darken_screen, play_boss_music, create_world_fog
    progress: 1.0 # используется при progress_from_time: false
    time: '{ctx:timer.timer}' # пустая строка отключает источник времени
    progress_from_time: true
    on_create: [ ]
    on_update: [ ]
    on_remove: [ ]
