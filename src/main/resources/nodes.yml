  # КОМПОНЕНТ: tick:timer
  # Таймер с обратным отсчетом, вызывающий события на каждом тике и по завершению
  # Поля:
  #   timer: int (обяз.) - начальное значение таймера в тиках
  #   on_create: list (опц., []) - действия при создании
  #   on_tick: list (опц., []) - действия на каждом тике (кроме последнего)
  #   on_remove: list (опц., []) - действия при удалении
  #   on_timer_end: list (опц., []) - действия когда таймер достиг нуля
  # Плейсхолдеры:
  #   {ctx:<имя>.timer} - оставшееся время в тиках
  # Логика:
  #   При создании вызывает on_create. На каждом тике уменьшает timer на 1.
  #   Пока timer > 0 → on_tick. После → on_timer_end → on_remove
  #   После on_timer_end автоматически вызывается on_remove
  #   Если кто-то удалит компонент через remove: <name> вызовется только on_remove
  #   При удалении вызывает on_remove.
  timer:
    type: tick:timer
    timer: 30
    on_create: []
    on_tick: []
    on_timer_end: []
    on_remove: []


