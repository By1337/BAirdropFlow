nodes:
  __init__:
    type: __init__
    on_init:
    - create: tto
    - create: region
  region:
    type: wg:region
    size: 15;15;15
    flags:
    - use deny
    - other-explosion deny
    - mob-damage allow
    - pvp allow
    - tnt deny
    - ghast-fireball deny
    - wither-damage deny
    - creeper-explosion deny
    - vehicle-destroy allow
    - interact deny
    - entry-deny-message -e
    - deny-message -e
    - exit-deny-message -e
    on_create:
    - create: schematic
    on_remove:
    - remove: schematic
  schematic:
    type: schematic:paster
    path: ../WorldEdit/schematics/asteroid.schem
    offset: 0;-1;0
    no_replace:
    - bedrock
    no_place:
    - air
    on_create:
    - create: commands
    on_remove:
    - create: commands_1
    replace:
      barrier: air
  tto_holo:
    type: dh:hologram
    offsets: 0.5;1.8;0.5
    lines:
    - '&cAirdrop'
    - '&fДо открытия: {ctx:tto.timer}'
  tte:
    type: tick:timer
    timer: 30
    on_create:
    - create: tte_holo
    on_tick:
    - call: update tte_holo
    on_timer_end: []
    on_remove:
    - remove: tte_holo
    - destroy: ''
  tte_holo:
    type: dh:hologram
    offsets: 0.5;1.8;0.5
    lines:
    - '&aAirdrop'
    - '&fДо удаления: {ctx:tte.timer}'
    on_create:
    - create: looter
    on_remove:
    - remove: looter
  looter:
    type: loot:looter
    offsets: 0;0;0
    loot_table: '{args:loot_table}'
    title: '&aAirdrop!'
    on_open:
    - create: commands_2
    on_create:
    - create: animation_1
    on_remove: []
  __destroy__:
    type: __destroy__
    on_destroy:
    - setblock: '{x} {y} {z} air'
    - remove: region
  animation:
    type: particle:animation
    animation: example
    ticks: -1
    on_create: []
    on_remove: []
    on_timer_end: []
    offsets: 0.5;0;0.5
  commands:
    type: default:commands
    on_run:
    - setblock: '{x} {y} {z} minecraft:respawn_anchor[charges=4]'
    - create: animation
  commands_1:
    type: default:commands
    on_run:
    - setblock: '{x} {y} {z} air'
    - remove: animation
  animation_1:
    type: particle:animation
    animation: explosion
    offsets: 0.5;0;0.5
    ticks: 30
    on_create: []
    on_remove: []
    on_timer_end: []
  commands_2:
    type: default:commands
    on_run:
    - message: '&7Личное сообщение для %player_name%'
  tto:
    type: tick:timer
    timer: 30
    on_create:
    - create: tto_holo
    on_tick:
    - call: update tto_holo
    on_timer_end:
    - create: tte
    on_remove:
    - remove: tto_holo
